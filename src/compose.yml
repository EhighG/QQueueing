name: qqueueing
services:

  qqueueing-main:
    build:
      context: .
      dockerfile: build/main/Dockerfile
    image: qqueueing-main
    ports:
      - "${MAIN_PORT:-8081}:8081"
    networks:
      - qqueueing-network
    volumes:
      # URL 등록 요청을 파이프(src/pipes)로 넘긴다.
      - ./pipes:/pipes
    depends_on:
      qqueueing-kafka:
        condition: service_healthy
      qqueueing-mongo:
        condition: service_started
      qqueueing-consumer:
        condition: service_healthy
        restart: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # application.yml의 기본값은 IDE 실행용(localhost)이다. 컨테이너에서는 아래 환경변수로 덮어쓴다.
    # 이름은 Spring relaxed binding 규칙을 따른다: 점(.)은 _로, 대시(-)는 빼고, 대문자로. 예: servers.replace-url → SERVERS_REPLACEURL
    environment:
      SPRING_DATA_MONGODB_URI: "mongodb://${MONGO_ROOT_USERNAME:-root}:${MONGO_ROOT_PASSWORD:-example}@qqueueing-mongo:27017/qqueueing?authSource=admin&authMechanism=SCRAM-SHA-1"
      KAFKA_BROKER: qqueueing-kafka:9092
      SERVERS_CONSUMER: qqueueing-consumer:8082
      SERVERS_FRONT: qqueueing-frontend:3000/waiting
      SERVERS_PARSING: http://qqueueing-frontend
      # 대기 페이지 리다이렉트 주소의 기준이다. testing.target-url도 이 값을 따른다.
      SERVERS_MAIN: ${PUBLIC_ORIGIN:-https://localhost}
      SERVERS_REPLACEURL: http://host.docker.internal
      PROMETHEUS_MONITORING: http://qqueueing-prometheus:9090

  qqueueing-mongo:
    image: mongo:5.0
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-example}
    networks:
      - qqueueing-network

  qqueueing-consumer:
    build:
      context: .
      dockerfile: build/consumer/Dockerfile
    image: qqueueing-consumer
    networks:
      - qqueueing-network
    ports:
      - "${CONSUMER_PORT:-8082}:8082"
    depends_on:
      qqueueing-kafka:
        condition: service_healthy
    # application.yml의 기본값은 IDE 실행용(localhost:9094)이다. 컨테이너에서는 환경변수로 덮어쓴다.
    environment:
      SPRING_KAFKA_CONSUMER_BOOTSTRAPSERVERS: qqueueing-kafka:9092

  qqueueing-frontend:
    build:
      context: .
      dockerfile: build/frontend/Dockerfile
      # NEXT_PUBLIC_* 값은 next build 때 번들에 박힌다. PUBLIC_ORIGIN을 바꾸면 --build로 다시 빌드해야 반영된다.
      args:
        NEXT_PUBLIC_BASE_URL: ${PUBLIC_ORIGIN:-https://localhost}/qqueueingAPI
        NEXT_PUBLIC_MONITORING_URL: ${PUBLIC_ORIGIN:-https://localhost}/qqueueingAPI
    image: qqueueing-frontend
    ports:
      - "${ADMIN_PORT:-3001}:3000"
    networks:
      - qqueueing-network

  # KRaft 단일 노드(broker와 controller를 한 프로세스에서 실행).
  # 컨테이너끼리는 PLAINTEXT(qqueueing-kafka:9092), 호스트에서 직접 실행하는 main·consumer는
  # PLAINTEXT_HOST(localhost:KAFKA_HOST_PORT, 기본 9094)로 붙는다.
  qqueueing-kafka:
    image: apache/kafka:3.9.1
    ports:
      - "${KAFKA_HOST_PORT:-9094}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://qqueueing-kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # 데이터 볼륨을 다시 쓸 때 포맷된 ID와 같아야 하므로 고정한다.
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    networks:
      - qqueueing-network

  qqueueing-prometheus:
    image: prom/prometheus:v3.5.0
    depends_on:
      - qqueueing-node-exporter
    ports:
      - "${PROMETHEUS_PORT:-3003}:9090"
    volumes:
      - ./build/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # command를 덮어쓰면 이미지 기본 인자(--config.file, --storage.tsdb.path)가 사라지므로 함께 적는다.
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - qqueueing-network

  qqueueing-node-exporter:
    image: prom/node-exporter:v1.9.1
    networks:
      - qqueueing-network
    ports:
      - "${NODE_EXPORTER_PORT:-8100}:9100"

  qqueueing-grafana:
    image: grafana/grafana:12.2.0
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    networks:
      - qqueueing-network

volumes:
  kafka_data:
  prometheus_data:

networks:
  # compose가 만든다. 다른 compose 프로젝트(데모 nginx 등)가 이 이름으로 붙을 수 있게 이름을 고정한다.
  qqueueing-network:
    name: qqueueing-network
