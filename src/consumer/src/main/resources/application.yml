# 기본값은 IDE나 gradlew bootRun으로 호스트에서 실행하는 기준이다(localhost와 루트 .env.example의 기본 호스트 포트).
# 컨테이너에서는 src/compose.yml이 환경변수로 덮어쓴다(Spring relaxed binding).
# 예: spring.kafka.consumer.bootstrap-servers → SPRING_KAFKA_CONSUMER_BOOTSTRAPSERVERS
server.port: 8082

spring:
  kafka:
    consumer:
      # 호스트용 Kafka listener(루트 .env의 KAFKA_HOST_PORT)
      bootstrap-servers: localhost:9094
      group-id: consumer_group01 # Group Id
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # main의 kafka.topics.enter.name과 같아야 한다.
      topic: queueing.waiting-queue.enter2
      max-poll-records: 100

logging:
  level:
    org.hibernate.SQL: debug
