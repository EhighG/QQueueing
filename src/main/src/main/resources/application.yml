# 기본값은 IDE나 gradlew bootRun으로 호스트에서 실행하는 기준이다(localhost와 루트 .env.example의 기본 호스트 포트).
# 컨테이너에서는 src/compose.yml이 환경변수로 덮어쓴다. 환경변수 이름은 Spring relaxed binding 규칙을 따른다.
# 점(.)은 _로 바꾸고 대시(-)는 빼고 대문자로 쓴다. 예: servers.main → SERVERS_MAIN, servers.replace-url → SERVERS_REPLACEURL
# 루트 .env에서 호스트 포트를 바꿨다면 IDE 실행 때도 같은 이름의 환경변수로 덮어쓴다.
server:
  #  tomcat:
  #    accept-count: 500
  ##    max-keep-alive-requests: -1
  ##    max-connections: 30000 # default 8192
  ##    connection-timeout: # default 60000 ms
  #    threads:
  #      max: 200 # default 200 / thread 경합..? 주의
  #      min-spare: 200

  port: 8081

  tomcat:
    mbeanregistry:
      enabled: true
    uri-encoding: UTF-8

  servlet:
    encoding:
      force-response: true
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: api-server

  data:
    mongodb:
      # 계정은 루트 .env.example의 MONGO_ROOT_USERNAME, MONGO_ROOT_PASSWORD 기본값과 같다.
      # 컨테이너에서는 compose가 루트 .env 값으로 SPRING_DATA_MONGODB_URI를 만든다.
      uri: mongodb://root:example@localhost:27017/qqueueing?authSource=admin&authMechanism=SCRAM-SHA-1
      auto-index-creation: true  # 자동 인덱스
    redis:
      # 대기열 상태(줄, 대기 번호, 입장 기록, 통과 토큰, 누적 입장 인원)를 둔다. 포트는 루트 .env.example의 REDIS_PORT 기본값과 같다.
      # 컨테이너에서는 compose가 SPRING_DATA_REDIS_HOST, SPRING_DATA_REDIS_PORT로 덮어쓴다.
      host: localhost
      port: 6379

  threads:
    virtual:
      enabled: true
#      enabled: false

servers: # 타 서버들의 정보 기록
  consumer: localhost:8082
  front: localhost:3001/waiting
  # 브라우저가 접속하는 공개 origin(루트 .env의 PUBLIC_ORIGIN). 대기 페이지 리다이렉트 주소를 만든다.
  main: https://localhost
  # WaitingService.parsing()이 이 값 뒤에 :3000을 붙인다.
  parsing: http://localhost

  replace-url: http://localhost # replace url value for forwarding to target

kafka:
  # 호스트용 Kafka listener(루트 .env의 KAFKA_HOST_PORT)
  broker: localhost:9094
  topics:
    enter:
      # consumer의 spring.kafka.consumer.topic과 같아야 한다.
      name: queueing.waiting-queue.enter2 # topic convention : messageType.datasetName.dataName / kebab-case, don't use '.' and '_' together
      retention-ms: 259200000 # 3 days

# actuator. Prometheus가 /monitoring/prometheus를 스크랩한다(src/build/prometheus/prometheus.yml).
management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: "*"
      base-path: "/monitoring"
      cors:
        allowed-origins: "*"
        allowed-headers: "*"
        allowed-methods: GET, POST, PATCH, DELETE, OPTIONS
  info:
    java:
      enabled: true
    os:
      enabled: true
    env:
      enabled: true

info:
  app:
    name: qqueueing
    company: 4EVERY1

# URL 등록·삭제 요청을 qqueueing-agent에 넘긴다(ScriptExecService).
# main은 path 디렉터리의 FIFO(pipe)에 "bash <fileNm> register|delete <url>" 한 줄을 쓰고,
# 에이전트(src/pipes/agent.sh)는 fileNm 자리가 conf.sh인 줄만 실행한다. path는 compose의 pipes 볼륨 마운트 위치다.
shell:
  path: /pipes
  fileNm: conf.sh

prometheus:
  monitoring: http://localhost:3003
