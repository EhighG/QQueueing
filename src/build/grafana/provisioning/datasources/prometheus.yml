# Grafana가 시작할 때 Prometheus 데이터소스를 만든다.
# 대시보드 JSON이 uid(qqueueing-prometheus)로 이 데이터소스를 참조하므로 uid를 바꾸지 않는다.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: qqueueing-prometheus
    access: proxy
    url: http://qqueueing-prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      # src/build/prometheus/prometheus.yml의 scrape_interval과 같게 둔다. 대시보드의 rate 구간 계산에 쓰인다.
      timeInterval: 1s
      prometheusType: Prometheus
      prometheusVersion: 3.5.0
