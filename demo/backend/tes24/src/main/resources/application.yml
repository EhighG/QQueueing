jwt:
  # HS256 서명 키. Base64 문자열이고, 디코딩했을 때 32바이트 이상이어야 한다.
  key: ${DEMO_JWT_KEY}
  access-expiration: 15
  refresh-expiration: 60

allowed-url:
  urls:
    - /member/dequeue
  patterns:
    - /api-docs/**
    - /swagger-ui/**
    - /websocket/**
    - /member/enqueue/**
    - /tes24/**
    - /logs/**
  anonymous:
    - /member/signup

qqueue:
  # 대기 상태를 물어볼 QQueueing main. compose의 qqueueing-network에서 서비스 이름으로 찾는다.
  server-url: qqueueing-main
  server-port: 8081

spring:
  datasource:
    hikari:
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: jdbc:mysql://demo-mysql:3306/demo?serverTimezone=UTC&useUniCode=yes&characterEncoding=UTF-8
      username: ${DEMO_MYSQL_USER}
      password: ${DEMO_MYSQL_PASSWORD}
  jpa:
    properties:
      hibernate:
        show_sql: false
        format_sql: false
  threads:
    virtual:
      enabled: true

springdoc:
  api-docs:
    enabled: true
    path: /api-docs/json
  swagger-ui:
    enabled: true
    path: /api-docs
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  cache:
    disabled: true
  package-to-scan: com.example.tes24

logging:
  level:
    org.springframework.security: off
