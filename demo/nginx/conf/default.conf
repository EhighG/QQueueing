# 데모 사이트 설정이다.
# URL 등록 스크립트(src/pipes/register.py)는 등록 URL의 호스트와 "443을 listen하는 server 블록"의
# server_name을 비교해서 그 블록에 location을 넣는다. 그래서 443 server 블록의 server_name은
# 데모 접속 주소(PUBLIC_ORIGIN)의 호스트와 같아야 하고, listen에는 포트 443을 그대로 쓴다.
# 이 파일은 src/pipes/module.py가 파싱하므로 include를 쓰지 않고, 따옴표 안에 세미콜론이나 중괄호를 넣지 않는다.

server {
	listen 443 ssl default_server;
	listen [::]:443 ssl default_server;
	server_name localhost;

	# demo/nginx/cert/를 compose가 마운트한다. 만드는 법은 demo/compose.yml의 demo-cert 참고.
	ssl_certificate /etc/ssl/demo/fullchain.pem;
	ssl_certificate_key /etc/ssl/demo/privkey.pem;

	# 데모 백엔드: /api/xxx -> demo-backend:8080/xxx
	location /api {
		rewrite ^/api/(.*)$ /$1 break;
		proxy_pass http://demo-backend:8080;
		proxy_pass_request_headers on;
		proxy_set_header Connection "";
		proxy_http_version 1.1;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header Host $host;
		proxy_buffering off;
		proxy_read_timeout 1h;
		proxy_cache off;
	}

	# 데모 프론트
	location / {
		proxy_pass http://demo-frontend:3000;
		proxy_set_header HOST $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_redirect off;
	}
}

# http로 들어오면 https로 보낸다. 로컬 개발용이라 브라우저가 캐시하지 않는 임시 리다이렉트(307)를 쓴다.
server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name localhost;
	return 307 https://$host$request_uri;
}
